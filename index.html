<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي الشلة - كورة V10</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;1000&display=swap" rel="stylesheet">
<style>
:root{--grass:#1f8a43;--dark:#0e4d24;--line:#f4fff6;--ink:#fff;--gold:#ffd54f;--red:#ff5a4d;--neon:#00e5ff;--purple:#7c4dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
 background:radial-gradient(circle at 20% 0%,#17113b 0,#080812 38%,#050509 100%);background-attachment:fixed}
header{background:linear-gradient(135deg,#08080d,#12102a 55%,#09090f);border-bottom:1px solid rgba(255,213,74,.28);box-shadow:0 8px 35px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;min-height:66px}
#back{background:none;border:0;color:var(--ink);font-size:32px;cursor:pointer;display:none;line-height:1}
#setBtn{background:none;border:0;color:var(--gold);font-size:24px;cursor:pointer}

main{flex:1;overflow-y:auto;padding:18px 14px 28px;max-width:560px;width:100%;margin:0 auto}
.fade-in{animation:fadeIn 0.25s ease-in-out}
@keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}

.menu button{display:flex;align-items:center;justify-content:flex-start;gap:16px;width:100%;height:72px;margin:0 0 10px;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.01));color:var(--ink);border:2px solid rgba(255,255,255,.12);border-radius:18px;font:800 19px Tajawal,sans-serif;cursor:pointer;padding:0 18px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.menu button i{font-style:normal;font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center;min-width:38px}

.btn{background:var(--dark);color:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 18px;font:800 17px Tajawal,sans-serif;cursor:pointer;transition:0.15s}
.btn:active{transform:scale(0.95)}
.btn.g{background:linear-gradient(135deg,#2e7d32,#1b5e20);border-color:#81c784}
.btn.gold{background:linear-gradient(135deg,#f57f17,#fbc02d);color:#111;border-color:var(--gold)}

.row{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0;flex-wrap:wrap}
.panel{background:rgba(18,16,41,0.92);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ttl{font-size:24px;font-weight:800;text-align:center;color:var(--gold);margin-bottom:12px}

.hint-step{background:rgba(255,255,255,.05);border-right:4px solid var(--neon);border-radius:8px;padding:10px;margin:6px 0;font-size:16px;font-weight:700}
.player-bank{display:flex;justify-content:space-between;background:rgba(255,255,255,.06);padding:10px 14px;border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.1)}
.ans{background:linear-gradient(135deg,var(--gold),#f57f17);color:#111;border-radius:14px;padding:12px;text-align:center;font-size:22px;font-weight:1000;margin:10px 0}

.free-card{background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(124,77,255,.2));border:2px dashed var(--neon);border-radius:18px;padding:15px;text-align:center;margin:12px 0;animation:pop 0.3s ease-out}
@keyframes pop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}

.blur-img{width:100%;max-width:280px;height:280px;object-fit:cover;border-radius:16px;margin:auto;display:block;transition:filter 0.3s}
.timer-box{font-size:48px;font-weight:1000;color:var(--gold);text-align:center;margin:10px 0}

input, select{font:500 17px Tajawal,sans-serif;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:12px;direction:ltr;cursor:pointer}
.brandMark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--gold),#ff7a00,var(--neon),var(--purple),var(--gold));font-size:22px}
.brandText{font-weight:1000;font-size:18px;background:linear-gradient(90deg,#fff,var(--gold),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
.heroLogo{margin:10px auto 16px;text-align:center;padding:18px;border-radius:22px;background:linear-gradient(145deg,rgba(124,77,255,.15),rgba(0,229,255,.05));border:1px solid rgba(255,213,74,.2)}
</style>
</head>
<body>
<header>
  <button id="back" aria-label="رجوع">&#8250;</button>
  <div class="brand" onclick="home()"><div class="brandMark">⚽</div><div><div class="brandText">ESLAM GAMES</div></div></div>
  <button id="setBtn" onclick="settings()">⚙️</button>
</header>
<main id="app"></main>

<script>
const $=s=>document.querySelector(s),app=$('#app');
let tm=null, autoSyncTimer=null;
let LIVE_DATA={who:[],trans:[],auction:[],updatedAt:null};

function playSound(type='click'){
  if(localStorage.getItem('eg_sound')==='off') return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();const g=ctx.createGain();
    osc.connect(g);g.connect(ctx.destination);
    if(type==='win'){osc.frequency.setValueAtTime(523,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.3);g.gain.fadeOut(0.3);}
    else{osc.frequency.setValueAtTime(320,ctx.currentTime);g.gain.fadeOut(0.08);}
    osc.start();osc.stop(ctx.currentTime+0.3);
  }catch(e){}
}

async function loadLiveData(){
  try{
    const r=await fetch('data/live.json?x='+Date.now(),{cache:'no-store'});
    if(r.ok){
      LIVE_DATA=await r.json();
      LIVE_DATA.updatedAt = new Date().toLocaleTimeString('ar-EG');
    }
  }catch(e){}
}
function startAutoSync(){
  loadLiveData();
  clearInterval(autoSyncTimer);
  autoSyncTimer = setInterval(loadLiveData, 5000);
}

/* 🔥 البنوك والبيانات لكل الفقرات 🔥 */

// 1. أنا مين
const DB_HARD_WHO = [
  { n: 'أندرس إنييستا', hints: ['1️⃣ بدأت مسيرتي في ألباسيتي قبل الانضمام لأكاديمية عملاقة.', '2️⃣ سجلت هدف حاسم في الدقيقة 116 في نهائي كاس العالم.', '3️⃣ أكثر من 600 مباراة مع نادٍ واحد و32 بطولة.', '4️⃣ اشتهرت بتمريرات السحرية مع زميل لي في خط الوسط.', '5️⃣ أنهيت مسيرتي في اليابان والإمارات.', '6️⃣ يُطلق علي لقب "الرسام".', '7️⃣ أسطورة برشلونة وإسبانيا وصاحب هدف كأس العالم 2010.'] },
  { n: 'زلاتان إبراهيموفيتش', hints: ['1️⃣ بدأت مسيرتي في مالمو ثم أياكس.', '2️⃣ لعبت لبرشلونة، يوفنتوس، إنتر، ميلان، ومانشستر.', '3️⃣ سجلت أكثر من 500 هدف بأشكال أكروباتية.', '4️⃣ لعبت في لوس أنجلوس جالاكسي أمريكا.', '5️⃣ اعتزلت في سن الـ 41.', '6️⃣ يلقب بـ "السلطان".', '7️⃣ أسطورة السويد زلاتان إبراهيموفيتش.'] }
];

// 2. المزايدة
const AUCTION_GLOBAL = [
  {pos: 'حارس مرمى', auc: 'تيبو كورتوا', free: 'يان أوبلاك'},
  {pos: 'مدافع', auc: 'فيرجيل فان دايك', free: 'إبراهيما كوناتي'},
  {pos: 'خط وسط', auc: 'كيفين دي بروين', free: 'جيمس ماديسون'},
  {pos: 'جناح', auc: 'فينيسيوس جونيور', free: 'جابرييل مارتينيلي'},
  {pos: 'مهاجم', auc: 'إرلينج هالاند', free: 'داروين نونيز'}

const AUCTION_LOCAL = [
  {pos: 'حارس مرمى', auc: 'محمد الشناوي', free: 'محمد صبحي'},
  {pos: 'مدافع', auc: 'أحمد حجازي', free: 'محمد عبد المنعم'},
  {pos: 'خط وسط', auc: 'إمام عاشور', free: 'نبيل عماد دونجا'},
  {pos: 'جناح', auc: 'أحمد سيد زيزو', free: 'حسين الشحات'},
  {pos: 'مهاجم', auc: 'مصطفى محمد', free: 'وسام أبو علي'}

// 3. مسيرة لاعب
const DB_CAREER = [

  { n: 'أنخيل دي ماريا', path: 'روزاريو سنترال ⬅️ بنفيكا ⬅️ ريال مدريد ⬅️ مانشستر يونايتد ⬅️ باريس ⬅️ يوفنتوس' },
  { n: 'ألكسيس سانشيز', path: 'كولو كولو ⬅️ أودينيزي ⬅️ برشلونة ⬅️ أرسنال ⬅️️ مانشستر يونايتد ⬅️ إنتر' }

// 4. الرابط المشترك
const DB_CONNECT = [
  { items: 'محمد صلاح - هاري كين - سون هيونج مين', ans: 'كلهم فازوا بالحذاء الذهبي للدوري الإنجليزي الممتاز' },
  { items: 'جوارديولا - أنشيلوتي - زيدان', ans: 'مدربون فازوا بدوري أبطال أوروبا كلاعبين ومدربين' },

// 5. تحدي 30 ثانية
const DB_SPEED = [

];

// 6. سوق التشكيلات
const DB_SHOP = [
  { n: 'كيليان إمبابي', p: 25, pos: 'مهاجم' },
  { n: 'جود بيلينجهام', p: 20, pos: 'وسط' },
  { n: 'أشرف حكيمي', p: 15, pos: 'مدافع' },
  { n: 'أليسون بيكر', p: 10, pos: 'حارس' },

];

// 7. الصورة المضببة
const DB_BLUR = [

  { n: 'محمد صلاح', img: 'https://upload.wikimedia.org/wikipedia/commons/4/4a/Mohamed_Salah_2018.jpg' }
];

const GAMES=[
 ['💰','المزايدة التنافسية',auction100M],
 ['🧢','أنا مين (7 تلميحات)',whoHard],
 ['🗺️','مسيرة لاعب (Career)',careerGame],
 ['🔗','الرابط المشترك',connectGame],
 ['⏱️','تحدي الـ 30 ثانية',speedGame],
 ['🛒','سوق التشكيلات (50M)',shopGame],
 ['🔍','مين في الصورة (Blur)',blurGame]
];

function home(){
  clearInterval(tm);$('#back').style.display='none';
  app.innerHTML='<div class="heroLogo fade-in"><div class="brandText" style="font-size:28px">ESLAM GAMES V10</div><p style="margin:5px 0 0;color:#aaa">7 فقرات كاملة للقعدة والتحدي 🔥</p></div><div class="menu fade-in"></div>';
  GAMES.forEach(g=>{
    const b=document.createElement('button');
    b.innerHTML='<i>'+g[0]+'</i><span>'+g[1]+'</span>';
    b.onclick=()=>{playSound('click');$('#back').style.display='block';g[2]();};
    app.querySelector('.menu').appendChild(b);
  });
}
$('#back').onclick=()=>{playSound('click');home();};

function settings(){
  playSound('click');
  $('#back').style.display='block';
  const sound=localStorage.getItem('eg_sound')!=='off';
  const initBal=localStorage.getItem('eg_balance')||100;
  app.innerHTML=`
    <div class="panel fade-in">
      <div class="ttl">⚙️ الإعدادات</div>
      <div class="player-bank"><span>🔊 الأصوات:</span><button class="btn" id="sndToggle">${sound?'مفعلة 🔔':'معطلة 🔕'}</button></div>
      <div class="player-bank" style="margin-top:10px"><span>💰 ميزانية المزاد:</span><input id="initBalInput" type="number" value="${initBal}" style="max-width:90px;text-align:center"></div>
      <button class="btn g" id="saveSet" style="width:100%;margin-top:15px">حفظ والتأكيد</button>
    </div>
  `;
  $('#sndToggle').onclick=()=>{ localStorage.setItem('eg_sound', sound?'off':'on'); settings(); };
  $('#saveSet').onclick=()=>{ localStorage.setItem('eg_balance', $('#initBalInput').value||100); playSound('win'); home(); };
}

/* 1. المزايدة */
function auction100M(){
  const startBank = parseInt(localStorage.getItem('eg_balance')) || 100;
  let p1 = { name: '', bank: startBank, team: [] }, p2 = { name: '', bank: startBank, team: [] };
  let activeList = [], round = 0;

  function setup(){
    app.innerHTML = `
      <div class="panel fade-in">
        <div class="ttl">💰 مزاد الخماسي بـ ${startBank}M</div>
        <div style="margin:15px 0">
          <select id="aucType" style="width:100%"><option value="global">🌍 لاعبين عالميين</option><option value="local">🇪🇬 لاعبين محليين</option></select>
        </div>
        <div class="row"><input id="n1" placeholder="المتنافس الأول"><input id="n2" placeholder="المتنافس الثاني"></div>
        <button class="btn g" id="startA" style="width:100%;margin-top:12px">🚀 بدء المزاد</button>
      </div>
    `;
    $('#startA').onclick = ()=>{
      p1.name = $('#n1').value.trim() \vert{}\vert{} '1'; p2.name = $('#n2').value.trim() || '2';
      activeList = $('#aucType').value === 'global' ? AUCTION_GLOBAL : AUCTION_LOCAL;
      playSound('click'); runRound();
    };
  }

  function runRound(){
    if(round >= activeList.length){
      app.innerHTML = `<div class="panel fade-in" style="text-align:center"><div class="ttl">🏆 انتهى المزاد!</div><button class="btn g" onclick="auction100M()" style="width:100%">🔄 جديد</button></div>`;
      return;
    }
    const item = activeList[round];
    app.innerHTML = `
      <div class="panel fade-in">
        <div class="ttl">${item.auc} (${item.pos})</div>
        <div class="player-bank"><span><b>${p1.name}</b>: ${p1.bank}M</span><span><b>${p2.name}</b>: ${p2.bank}M</span></div>
        <div class="row"><input id="bidPrice" type="number" placeholder="المبلغ (M)"><select id="winnerSel"><option value="1">${p1.name}</option><option value="2">${p2.name}</option></select></div>
        <button class="btn g" id="confirmBid" style="width:100%">تأكيد الشراء 🤝</button>
        <div id="freeRevealArea"></div>
      </div>
    `;
    $('#confirmBid').onclick = ()=>{
      const cost = parseInt($('#bidPrice').value) || 0;
      const winVal = $('#winnerSel').value;
      let loserName = winVal==='1' ? p2.name : p1.name;
      if(winVal==='1'){ p1.bank-=cost; p1.team.push(item.auc); p2.team.push(item.free); }
      else { p2.bank-=cost; p2.team.push(item.auc); p1.team.push(item.free); }
      playSound('win');
      $('#confirmBid').style.display='none';
      $('#freeRevealArea').innerHTML = `
        <div class="free-card"><h3>🎉 مبروك لـ ${loserName}!</h3><div style="font-size:24px;color:var(--neon);font-weight:1000">${item.free} 🌟</div><p>لاعب مجاني مكافئ بنفس المركز!</p></div>
        <button class="btn gold" id="nextRoundBtn" style="width:100%">التالي ⏩</button>
      `;
      $('#nextRoundBtn').onclick = ()=>{ round++; runRound(); };
    };
  }
  setup();
}

/* 2. أنا مين */
function whoHard(){
  let qIdx = 0, hintStep = 1;
  function render(){
    const cur = DB_HARD_WHO[qIdx];
    let hintsHTML = cur.hints.slice(0, hintStep).map(h=>`<div class="hint-step">${h}</div>`).join('');
    app.innerHTML = `
      <div class="panel fade-in">
        <div class="ttl">🧢 أنا مين؟</div>
        <div>${hintsHTML}</div>
        <div class="ans" id="whoAns" hidden>${cur.n}</div>
        <div class="row">
          ${hintStep < 7 ? `<button class="btn g" id="nextHint">💡 تلميح (${hintStep}/7)</button>` : ''}
          <button class="btn gold" id="revealWho">👁️ كشف</button>
        </div>
        <button class="btn" id="nextQ" style="width:100%;margin-top:10px">التالي 🔄</button>
      </div>
    `;
    if($('#nextHint')) $('#nextHint').onclick = ()=>{ hintStep++; render(); };
    $('#revealWho').onclick = ()=>{ $('#whoAns').hidden = !$('#whoAns').hidden; };
    $('#nextQ').onclick = ()=>{ qIdx = (qIdx+1)%DB_HARD_WHO.length; hintStep = 1; render(); };
  }
  render();
}

/* 3. مسيرة لاعب */
function careerGame(){
  let idx = 0;

    app.innerHTML = `

        <div class="ans" id="cAns" hidden>${cur.n}</div>
        <div class="row">
          <button class="btn gold" onclick="$('#cAns').hidden=!$('#cAns').hidden">👁️ كشف اللاعب</button>
          <button class="btn g" onclick="idx=(idx+1)%DB_CAREER.length;careerGame()">التالي 🔄</button>
        </div>
      </div>
    `;
  }
  render();
}

        <div class="ans" id="cnAns" hidden style="font-size:18px">${cur.ans}</div>

          <button class="btn gold" onclick="$('#cnAns').hidden=!$('#cnAns').hidden">👁️ كشف الرابط</button>

/* 5. تحدي 30 ثانية */
function speedGame(){
  let idx = 0, timer = 30;
  function render(){
    app.innerHTML = `
      <div class="panel fade-in" style="text-align:center">
        <div class="ttl">⏱️️ تحدي الـ 30 ثانية</div>
        <div style="font-size:20px;font-weight:800;margin:15px 0;color:var(--neon)">${DB_SPEED[idx]}</div>
        <div class="timer-box" id="tBox">${timer}</div>
        <div class="row">
          <button class="btn g" id="sTimer">▶️ ابدأ الوقت</button>
          <button class="btn" onclick="idx=(idx+1)%DB_SPEED.length;speedGame()">سؤال آخر 🔄</button>
        </div>
      </div>
    `;
    $('#sTimer').onclick = ()=>{
      clearInterval(tm);
      timer = 30;
      tm = setInterval(()=>{
        timer--;
        $('#tBox').textContent = timer;
        if(timer <= 0){ clearInterval(tm); playSound('win'); alert('⏰ انتهى الوقت!'); }
      }, 1000);
    };
  }
  render();
}

/* 6. سوق التشكيلات */
function shopGame(){
  let budget = 50, myTeam = [];
  function render(){
    let listHTML = DB_SHOP.map((p,i)=>`
      <div class="player-bank">
        <span><b>${p.n}</b> (${p.pos})</span>
        <button class="btn gold" onclick="buyP(${i})">${p.p}M 🛒</button>
      </div>
    `).join('');
    app.innerHTML = `
      <div class="panel fade-in">
        <div class="ttl">🛒 سوق التشكيلات</div>
        <div style="text-align:center;font-size:20px;font-weight:800;color:var(--neon);margin-bottom:10px">الميزانية المتبقية: ${budget}M</div>
        <div>${listHTML}</div>
        <div style="margin-top:15px;background:rgba(255,255,255,0.05);padding:10px;border-radius:12px">
          <b>تشكيلتك:</b> ${myTeam.length ? myTeam.join(' - ') : 'لم تشتري لاعبين بعد'}
        </div>
        <button class="btn g" onclick="shopGame()" style="width:100%;margin-top:10px">🔄 إعادة تعيين</button>
      </div>
    `;
  }
  window.buyP = (i)=>{
    const item = DB_SHOP[i];
    if(item.p > budget){ alert('الميزانية لا تكفي!'); return; }
    budget -= item.p;
    myTeam.push(item.n);
    playSound('click');
    render();
  };
  render();
}

/* 7. مين في الصورة المضببة */
function blurGame(){
  let idx = 0, blurVal = 20;
  function render(){
    const cur = DB_BLUR[idx];
    app.innerHTML = `
      <div class="panel fade-in" style="text-align:center">
        <div class="ttl">🔍 مين في الصورة؟</div>
        <img src="${cur.img}" class="blur-img" id="bImg" style="filter:blur(${blurVal}px)">
        <div class="ans" id="blAns" hidden>${cur.n}</div>
        <div class="row" style="margin-top:12px">
          <button class="btn g" id="unblur">Clarify 🔍 (توضيح)</button>
          <button class="btn gold" onclick="$('#blAns').hidden=!$('#blAns').hidden">👁️ كشف</button>
        </div>
        <button class="btn" onclick="idx=(idx+1)%DB_BLUR.length;blurVal=20;blurGame()" style="width:100%;margin-top:10px">الصورة التالية 🔄</button>
      </div>
    `;
    $('#unblur').onclick = ()=>{
      if(blurVal > 0) blurVal -= 5;
      $('#bImg').style.filter = `blur(${blurVal}px)`;
      playSound('click');
    };
  }
  render();
}

startAutoSync();
home();
</script>
