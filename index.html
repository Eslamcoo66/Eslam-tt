<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي الشلة - كورة V7</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;1000&display=swap" rel="stylesheet">
<style>
:root{--grass:#1f8a43;--dark:#0e4d24;--line:#f4fff6;--ink:#fff;--gold:#ffd54f;--red:#ff5a4d;--neon:#00e5ff;--purple:#7c4dff;--card-bg:#121029}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
 background:radial-gradient(circle at 20% 0%,#17113b 0,#080812 38%,#050509 100%);background-attachment:fixed}
header{background:linear-gradient(135deg,#08080d,#12102a 55%,#09090f);border-bottom:1px solid rgba(255,213,74,.28);box-shadow:0 8px 35px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;position:relative;min-height:66px;padding-top:env(safe-area-inset-top,0px)}
#back{position:absolute;right:12px;bottom:12px;background:none;border:0;color:var(--ink);font-size:32px;line-height:1;cursor:pointer;display:none}
main{flex:1;overflow-y:auto;padding:18px 14px 28px;max-width:560px;width:100%;margin:0 auto}

.fade-in{animation:fadeIn 0.25s ease-in-out}
@keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}

.menu button{display:flex;align-items:center;justify-content:flex-start;gap:18px;width:100%;height:80px;margin:0 0 12px;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.01));color:var(--ink);border:2px solid rgba(255,255,255,.12);border-radius:20px;font:800 20px Tajawal,sans-serif;cursor:pointer;padding:0 20px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.menu button i{font-style:normal;font-size:38px;line-height:1;display:flex;align-items:center;justify-content:center;min-width:44px}

.btn{background:var(--dark);color:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 18px;font:800 17px Tajawal,sans-serif;cursor:pointer;transition:0.15s}
.btn:active{transform:scale(0.95)}
.btn.g{background:linear-gradient(135deg,#2e7d32,#1b5e20);border-color:#81c784}
.btn.gold{background:linear-gradient(135deg,#f57f17,#fbc02d);color:#111;border-color:var(--gold)}

.row{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0;flex-wrap:wrap}
.panel{background:rgba(18,16,41,0.92);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ttl{font-size:24px;font-weight:800;text-align:center;color:var(--gold);margin-bottom:12px}

/* تحسين صور فقرة مين اللاعب بدقة عالية HD */
.photoSolo{text-align:center;background:#05050c;border:2px solid rgba(0,229,255,.3);border-radius:20px;padding:12px;margin:12px 0;overflow:hidden}
.myPlayer{width:100%;max-width:320px;height:320px;object-fit:cover;border-radius:16px;display:block;margin:auto;box-shadow:0 0 25px rgba(0,229,255,.2);border:1px solid rgba(255,255,255,.2)}

/* تلميحات 7 مستويات */
.hint-step{background:rgba(255,255,255,.05);border-right:4px solid var(--neon);border-radius:8px;padding:10px;margin:6px 0;font-size:16px;font-weight:700}
.hint-num{color:var(--gold);font-weight:1000;margin-left:6px}

/* كروت المزايدة والرصيد */
.player-bank{display:flex;justify-content:space-between;background:rgba(255,255,255,.06);padding:10px 14px;border-radius:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.1)}
.ans{background:linear-gradient(135deg,var(--gold),#f57f17);color:#111;border-radius:14px;padding:12px;text-align:center;font-size:22px;font-weight:1000;margin:10px 0}

input{font:500 17px Tajawal,sans-serif;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;flex:1;min-width:0}
.brand{display:flex;align-items:center;gap:12px;direction:ltr;cursor:pointer}
.brandMark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--gold),#ff7a00,var(--neon),var(--purple),var(--gold));font-size:22px}
.brandText{font-weight:1000;font-size:18px;background:linear-gradient(90deg,#fff,var(--gold),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
.heroLogo{margin:10px auto 16px;text-align:center;padding:18px;border-radius:22px;background:linear-gradient(145deg,rgba(124,77,255,.15),rgba(0,229,255,.05));border:1px solid rgba(255,213,74,.2)}
</style>
</head>
<body>
<header><button id="back" aria-label="رجوع">&#8250;</button><div class="brand" onclick="home()"><div class="brandMark">⚽</div><div><div class="brandText">ESLAM GAMES</div></div></div></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let tm=null;

function playSound(type='click'){
  if(localStorage.getItem('eg_sound')==='off') return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();const g=ctx.createGain();
    osc.connect(g);g.connect(ctx.destination);
    if(type==='win'){osc.frequency.setValueAtTime(523,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.3);g.gain.fadeOut(0.3);}
    else{osc.frequency.setValueAtTime(320,ctx.currentTime);g.gain.fadeOut(0.08);}
    osc.start();osc.stop(ctx.currentTime+0.3);
  }catch(e){}
}

/* بنك لاعبين صعبة جداً لفقرة مين اللاعب (صور عالية الجودة) */
const DB_PHOTOS = [
  {n:'ريكاردو كواريسما', photo:'https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/ricardo-quaresma-portugal-national-team-star-football-soccer-ricardo-quaresma-transparent.png'},
  {n:'أندرس إنييستا', photo:'https://upload.wikimedia.org/wikipedia/commons/6/67/Andres_Iniesta.jpg'},
  {n:'جابرييل باتيستوتا', photo:'https://upload.wikimedia.org/wikipedia/commons/4/4b/Gabriel_Batistuta_1999.jpg'},
  {n:'فرانك ريبيري', photo:'https://upload.wikimedia.org/wikipedia/commons/3/30/Franck_Rib%C3%A9ry_2019.jpg'},
  {n:'دافيد فيا', photo:'https://upload.wikimedia.org/wikipedia/commons/e/eb/David_Villa_2011.jpg'},
  {n:'نجولو كانتي', photo:'https://upload.wikimedia.org/wikipedia/commons/a/ad/N%27Golo_Kant%C3%A9_2018.jpg'}
];

/* فقرة أنا مين (7 تلميحات بالترتيب من الأصعب لـ الأسهل) */
const DB_HARD_WHO = [
  {
    n: 'أندرس إنييستا',
    hints: [
      '1️⃣ بدأت مسيرتي الشبابية في نادي ألباسيتي قبل الانضمام لأكاديمية عملاقة.',
      '2️⃣ سجلت هدف حاسم في الدقيقة 116 في مباراة نهائية تاريخية.',
      '3️⃣ خضت أكثر من 600 مباراة مع نادٍ واحد وحققت معهم 32 بطولة.',
      '4️⃣ اشتهرت بتمريرات السحرية وثنائية مرعبة في خط الوسط مع زميل لي.',
      '5️⃣ أنهيت مسيرتي الكروية في الدوريات اليابانية والإماراتية.',
      '6️⃣ يُطلق علي لقب "الرسام" (El Ilusionista).',
      '7️⃣ أسطورة خط وسط برشلونة ومنتخب إسبانيا وصاحب هدف كأس العالم 2010.'
    ]
  },
  {
    n: 'جابرييل باتيستوتا',
    hints: [
      '1️⃣ لعبت لناديي ريفر بليت وبوكا جونيورز قبل الانتقال لإيطاليا.',
      '2️⃣ بقيت وفياً لنادي فيورنتينا الإيطالي لمدة 9 سنوات رغم هبوطهم.',
      '3️⃣ فزت بالدوري الإيطالي (السكوديتو) مع نادي روما عام 2001.',
      '4️⃣ كنت الهداف التاريخي لمنتخب بلادي حتى جاء لاعب معجزة وكسر الرقم.',
      '5️⃣ اشتهرت بلقب "باتيجول" (Batigol) واحتفال الرشاش الشهير.',
      '6️⃣ مهاجم أرجنتيني مرعب في فترة التسعينات.',
      '7️⃣ أسطورة الهجوم الأرجنتيني صاحب التسديدات القاتلة.'
    ]
  },
  {
    n: 'ريكاردو كواريسما',
    hints: [
      '1️⃣ تخرجت من أكاديمية سبورتينج لشبونة في نفس فترة صعود كريستيانو رونالدو.',
      '2️⃣ لعبت لبرشلونة، إنتر ميلان، تشيلسي، وبشكتاش التركي.',
      '3️⃣ اشتهرت بأسلوب تسديد ونقرات خرافية خارج القدم يُعرف بـ (Trivela).',
      '4️⃣ عرفني الجمهور بوشوم الرقبة والوجه المتميزة.',
      '5️⃣ فزت بدوري أبطال أوروبا مع إنتر ميلان تحت قيادة مورينيو 2010.',
      '6️⃣ جناح برتغالي فاز ببطل أمم أوروبا 2016.',
      '7️⃣ الساحر البرتغالي صاحب أشهر ضربات "التريفيلأ" في تاريخ الكرة.'
    ]
  }
];

/* بنك المزايدات التنافسية (مزادات أساطير + مجاني) */
const AUCTION_PAIRS = [
  {pos: 'مهاجم', auc: 'إرلينج هالاند', free: 'داروين نونيز'},
  {pos: 'وسط', auc: 'كيفين دي بروين', free: 'جيمس ماديسون'},
  {pos: 'جناح', auc: 'فينيسيوس جونيور', free: 'جابرييل مارتينيلي'},
  {pos: 'مدافع', auc: 'فيرجيل فان دايك', free: 'إبراهيما كوناتي'},
  {pos: 'حارس', auc: 'تيبو كورتوا', free: 'يان أوبلاك'}
];

const GAMES=[
 ['📸','مين اللاعب؟ (HD)',photoGame],
 ['🧢','أنا مين (7 تلميحات)',whoHard],
 ['💰','المزايدة بـ 100M',auction100M],
 ['⚽','إكس أو بالكورة',xo],
 ['🥅','ضربات جزاء',pen]
];

function home(){
  clearInterval(tm);$('#back').style.display='none';
  app.innerHTML='<div class="heroLogo fade-in"><div class="brandText" style="font-size:28px">ESLAM GAMES V7</div><p style="margin:5px 0 0;color:#aaa">نسخة التحديات الصعبة والقعدات 🔥</p></div><div class="menu fade-in"></div>';
  GAMES.forEach(g=>{
    const b=document.createElement('button');
    b.innerHTML='<i>'+g[0]+'</i><span>'+g[1]+'</span>';
    b.onclick=()=>{playSound('click');$('#back').style.display='block';g[2]();};
    app.querySelector('.menu').appendChild(b);
  });
}
$('#back').onclick=()=>{playSound('click');home();};

/* 1. فقرة مين اللاعب بدقة وصعوبة */
function photoGame(){
  let idx = Math.floor(Math.random()*DB_PHOTOS.length);
  function render(){
    const player = DB_PHOTOS[idx];
    app.innerHTML=`
      <div class="panel fade-in">
        <div class="ttl">📸 مين اللاعب؟ (صعب)</div>
        <div class="photoSolo">
          <img src="${player.photo}" class="myPlayer" onerror="this.src='https://via.placeholder.com/300?text=Image+Error'">
        </div>
        <div class="ans" id="pAns" hidden>${player.n}</div>
        <div class="row">
          <button class="btn gold" id="sh">👁️ كشف اللاعب</button>
          <button class="btn g" id="nx">🔄 لاعب آخر</button>
        </div>
      </div>
    `;
    $('#sh').onclick=()=>{playSound('click');$('#pAns').hidden = !$('#pAns').hidden;};
    $('#nx').onclick=()=>{playSound('click');idx = (idx+1)%DB_PHOTOS.length;render();};
  }
  render();
}

/* 2. فقرة أنا مين (7 تلميحات متدرجة) */
function whoHard(){
  let qIdx = 0;
  let hintStep = 1;

  function render(){
    const cur = DB_HARD_WHO[qIdx];
    let hintsHTML = '';
    for(let i=0; i<hintStep; i++){
      hintsHTML += `<div class="hint-step">${cur.hints[i]}</div>`;
    }

    app.innerHTML = `
      <div class="panel fade-in">
        <div class="ttl">🧢 أنا مين؟ (تلميحات مدرجة)</div>
        <div style="margin-bottom:12px">${hintsHTML}</div>
        <div class="ans" id="whoAns" hidden>${cur.n}</div>
        <div class="row">
          ${hintStep < 7 ? `<button class="btn g" id="nextHint">💡 التلميح التالي (${hintStep}/7)</button>` : ''}
          <button class="btn gold" id="revealWho">👁️ كشف الإجابة</button>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="nextQ" style="width:100%">السؤال التالي 🔄</button>
        </div>
      </div>
    `;

    if($('#nextHint')){
      $('#nextHint').onclick = ()=>{ playSound('click'); hintStep++; render(); };
    }
    $('#revealWho').onclick = ()=>{ playSound('click'); $('#whoAns').hidden = !$('#whoAns').hidden; };
    $('#nextQ').onclick = ()=>{ playSound('click'); qIdx = (qIdx+1)%DB_HARD_WHO.length; hintStep = 1; render(); };
  }
  render();
}

/* 3. نظام المزايدة المطور بـ 100M ورصيد تلقائي واللاعب المجاني */
function auction100M(){
  let p1 = { name: '', bank: 100, team: [] };
  let p2 = { name: '', bank: 100, team: [] };
  let round = 0;

  function setup(){
    app.innerHTML = `
      <div class="panel fade-in">
        <div class="ttl">💰 مزاد الـ 100 مليون</div>
        <p style="text-align:center">كل طرف معاه 100M. اللي هيشتري اللاعب ثمنه هيتخصم تلقائي، والخاسر هينزل أوتوماتيك لاعب مجاني مكافئ في مقاعده!</p>
        <div class="row"><input id="n1" placeholder="اسم المنافس الأول"><input id="n2" placeholder="اسم المنافس الثاني"></div>
        <button class="btn g" id="startA" style="width:100%;margin-top:10px">🚀 بدء المزاد</button>
      </div>
    `;
    $('#startA').onclick = ()=>{
      p1.name = $('#n1').value.trim() || 'المتنافس 1';
      p2.name = $('#n2').value.trim() || 'المتنافس 2';
      playSound('click');
      runRound();
    };
  }

  function runRound(){
    if(round >= AUCTION_PAIRS.length){
      app.innerHTML = `
        <div class="panel fade-in" style="text-align:center">
          <div class="ttl">🏆 انتهت المزايدة!</div>
          <div class="player-bank"><b>${p1.name} (المتبقي: ${p1.bank}M):</b> <div>${p1.team.join(', ')}</div></div>
          <div class="player-bank"><b>${p2.name} (المتبقي: ${p2.bank}M):</b> <div>${p2.team.join(', ')}</div></div>
          <button class="btn g" onclick="auction100M()" style="width:100%;margin-top:15px">🔄 مزاد جديد</button>
        </div>
      `;
      return;
    }

    const item = AUCTION_PAIRS[round];
    app.innerHTML = `
      <div class="panel fade-in">
        <div class="ttl">المزاد على: ${item.auc} (${item.pos})</div>
        
        <div class="player-bank"><span><b>${p1.name}</b></span><span>💰 المتبقي: <b>${p1.bank}M</b></span></div>
        <div class="player-bank"><span><b>${p2.name}</b></span><span>💰 المتبقي: <b>${p2.bank}M</b></span></div>
        
        <div style="background:rgba(0,0,0,0.3);padding:14px;border-radius:14px;margin:12px 0">
          <p style="margin:0 0 8px;font-weight:800;text-align:center">حدد الفائز والمبلغ الناهئي للمزاد:</p>
          <div class="row">
            <input id="bidPrice" type="number" placeholder="المبلغ (مثلاً: 35M)">
            <select id="winnerSel" style="padding:10px;border-radius:10px;background:#111;color:#fff;font-weight:800">
              <option value="1">${p1.name}</option>
              <option value="2">${p2.name}</option>
            </select>
          </div>
        </div>
        
        <button class="btn g" id="confirmBid" style="width:100%">تأكيد الشراء والحصول على المجاني 🤝</button>
      </div>
    `;

    $('#confirmBid').onclick = ()=>{
      const cost = parseInt($('#bidPrice').value) || 0;
      const winVal = $('#winnerSel').value;

      if(winVal === '1'){
        if(cost > p1.bank){ alert('الرصيد لا يكفي!'); return; }
        p1.bank -= cost;
        p1.team.push(`${item.auc} (${cost}M)`);
        p2.team.push(`${item.free} (مجاني 🎁)`);
      } else {
        if(cost > p2.bank){ alert('الرصيد لا يكفي!'); return; }
        p2.bank -= cost;
        p2.team.push(`${item.auc} (${cost}M)`);
        p1.team.push(`${item.free} (مجاني 🎁)`);
      }

      playSound('win');
      round++;
      runRound();
    };
  }

  setup();
}

/* ألعاب إضافية تسلية */
function xo(){
  let b=Array(9).fill(''),t='⚽',over=false;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  app.innerHTML='<div class="panel fade-in"><div class="ttl">إكس أو بالكورة</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:auto" id="g"></div><button class="btn g" onclick="xo()" style="width:100%;margin-top:12px">ماتش جديد</button></div>';
  const g=$('#g');
  b.forEach((v,i)=>{const c=document.createElement('button');c.style.aspectRatio='1';c.style.fontSize='36px';c.style.background='#111';c.style.border='1px solid #444';c.style.borderRadius='12px';c.textContent=v;
    c.onclick=()=>{if(over||b[i])return;playSound('click');b[i]=t;
      if(L.some(l=>l.every(k=>b[k]===t))){over=true;alert('🏆 الفائز: '+t);playSound('win')}
      else{t=t==='⚽'?'🥅':'⚽'}xoDraw()};g.appendChild(c)});
  function xoDraw(){Array.from(g.children).forEach((c,i)=>c.textContent=b[i]);}
}

function pen(){
  app.innerHTML='<div class="panel fade-in"><div class="ttl">🥅 ضربات جزاء</div><p style="text-align:center">تسديدة سريعة!</p><button class="btn g" onclick="alert(Math.random()>0.4?\'جووووول ⚽\':\'ضاعت ❌\')" style="width:100%">شوط الكرة</button></div>';
}

home();
</script>
</body>
</html>
