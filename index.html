<head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap');
:root{--bg:#0b5b2a;--bg2:#073d1c;--panel:#061b0d;--line:#39e36b;--gold:#ffd83d;--txt:#fff;--muted:#b9dfc4;--red:#ff5252;--blue:#42a5f5}:root[data-theme=light]{--bg:#2e7d32;--bg2:#1b5e20;--panel:#f2fbf4;--line:#2e7d32;--gold:#ffd700;--txt:#123;--muted:#356b45}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Tajawal,Arial,sans-serif;background:repeating-linear-gradient(90deg,var(--bg) 0 56px,var(--bg2) 56px 112px);color:var(--txt)}
body{padding-bottom:env(safe-area-inset-bottom)}header{position:sticky;top:0;z-index:5;min-height:74px;padding:env(safe-area-inset-top) 14px 0;background:linear-gradient(#021007,#061b0d);border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center}.brand{font-size:27px;font-weight:900;color:var(--gold);text-shadow:0 2px 5px #000}.back{display:none;position:absolute;right:10px;bottom:13px;border:0;background:none;color:var(--gold);font-size:34px;font-weight:900}.wrap{width:min(620px,100%);margin:auto;padding:18px 13px 32px}.menu{display:grid;gap:12px}.gamebtn{width:100%;min-height:82px;border:3px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#082e15,#041b0c);color:#fff;display:flex;align-items:center;justify-content:center;gap:13px;font-size:20px;font-weight:900;box-shadow:0 5px 16px #0006;cursor:pointer}.gamebtn .ico{font-size:32px}.panel{background:rgba(4,27,12,.96);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #0005}.title{font-size:25px;font-weight:900;color:var(--gold);margin-bottom:12px;text-align:center}.sub{text-align:center;color:var(--muted);font-weight:700;line-height:1.5}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;margin:11px 0}.btn,input,select{font:800 17px Tajawal,Arial,sans-serif}.btn{border:2px solid var(--line);background:#0a401d;color:#fff;border-radius:13px;padding:11px 15px;cursor:pointer}.btn.gold{background:var(--gold);color:#111;border-color:#fff}.btn.red{background:var(--red);border-color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}input,select{min-width:0;flex:1;padding:11px;border:2px solid var(--line);border-radius:12px;background:#041b0c;color:#fff;outline:none}input::placeholder{color:#9fc5a8}.badge{display:inline-block;background:#0a401d;border:2px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:900}.hint{background:#0a401d;border:2px solid #277f45;border-radius:13px;padding:11px;margin:8px 0;font-weight:800;line-height:1.45}.answer{background:var(--gold);color:#111;border-radius:14px;padding:13px;text-align:center;font-size:23px;font-weight:900;margin:10px 0}.hidden{display:none!important}.scoreline{display:flex;justify-content:space-between;gap:8px;background:#0a401d;border:2px solid #277f45;border-radius:12px;padding:10px;margin:7px 0;font-weight:800}.card{border:3px solid var(--line);border-radius:18px;padding:18px;text-align:center;background:#082d14;font-size:27px;font-weight:900}.path{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;align-items:center}.club{padding:8px 10px;background:#0a401d;border:2px solid #277f45;border-radius:11px;font-weight:900}.arrow{color:var(--gold);font-size:21px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:380px;margin:auto;direction:ltr}.xo button{aspect-ratio:1;border:3px solid var(--line);background:#082d14;color:#fff;border-radius:14px;font-size:45px}.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#082d14;border:3px solid var(--line);padding:8px;border-radius:14px}.c4 button{aspect-ratio:1;border:0;border-radius:50%;background:#155e2b}.c4 button.r{background:#ff4242}.c4 button.y{background:#ffd83d}.goal{height:150px;max-width:390px;margin:12px auto;border:3px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:center;font-size:58px;background:repeating-linear-gradient(45deg,#ffffff10 0 10px,#ffffff1c 10px 11px)}.dots{text-align:center;font-size:26px;min-height:38px}.photo{display:block;width:100%;max-height:360px;object-fit:contain;border-radius:18px;border:3px solid var(--line);background:#000;margin:12px 0}.big{font-size:54px;font-weight:900;text-align:center}.center{text-align:center}.small{font-size:14px;color:var(--muted)}.list{display:grid;gap:8px}.playerrow{display:flex;gap:8px;align-items:center;background:#0a401d;border:2px solid #277f45;border-radius:13px;padding:9px}.playerrow b{flex:1}.toggle{width:100%;text-align:right}
</style>
</head>
<body>
<header><button id="back" class="back">›</button><div id="brand" class="brand">👑 Eslam Games ⚽</div></header>
<main id="app" class="wrap"></main>
<script>
'use strict';
const app=document.getElementById('app'),back=document.getElementById('back'),brand=document.getElementById('brand');
const shuffle=a=>[...a].sort(()=>Math.random()-.5), $=s=>document.querySelector(s);
let timer=null, currentHome=true;
function readLS(key, fallback=''){try{return localStorage.getItem(key) ?? fallback}catch(e){return fallback}}
function writeLS(key,value){try{localStorage.setItem(key,value)}catch(e){} }
function readBool(key,fallback=true){const v=readLS(key,'');if(v==='true')return true;if(v==='false')return false;return fallback}
const state={sound:readBool('eg_sound',true),theme:readLS('eg_theme','dark')||'dark'};
const players=[
{name:'ليونيل ميسي',h:['سجلت 91 هدفاً في سنة 2012','ارتديت الرقم 30 قبل الرقم 10','فزت بكأس العالم 2022','لعبت معظم مسيرتي مع برشلونة']},
{name:'كريستيانو رونالدو',h:['بدأت مع سبورتينج لشبونة بالرقم 28','سجلت أكثر من 450 هدفاً لريال مدريد','أنا الهداف التاريخي لمنتخب البرتغال','لعبت لمانشستر يونايتد ويوفنتوس والنصر']},
{name:'محمد صلاح',h:['سجلت 32 هدفاً في أول موسم لي مع ليفربول بالبريميرليج','لعبت لفيورنتينا وروما','بدأت في المقاولون العرب','أنا قائد منتخب مصر ونجم ليفربول']},
{name:'كريم بنزيما',h:['فزت بالكرة الذهبية 2022','بدأت في ليون','حققت دوري الأبطال مع ريال مدريد عدة مرات','ألعب حالياً مع الاتحاد']},
{name:'عصام الحضري',h:['شاركت في كأس العالم 2018 بعمر 45 سنة','لعبت لنادي سيون السويسري','حققت أمم أفريقيا مع مصر عدة مرات','من أشهر حراس مرمى الأهلي ومصر']},
{name:'لوكا مودريتش',h:['كرواتي','فزت بالكرة الذهبية 2018','ارتبط اسمي بريال مدريد لسنوات طويلة','لعبت في توتنهام قبل ريال مدريد']},
{name:'سيرجيو راموس',h:['مدافع إسباني','ارتبط اسمي بريال مدريد لسنوات','سجلت هدفاً شهيراً في نهائي دوري الأبطال 2014','لعبت أيضاً لباريس سان جيرمان']},
{name:'كيفن دي بروين',h:['بلجيكي','لعبت مع فولفسبورج','صنعت وسجلت كثيراً مع مانشستر سيتي','لعبت مع تشيلسي في بداية مسيرتي']}
];
const transfers=[
{name:'زلاتان إبراهيموفيتش',c:['مالمو','أياكس','يوفنتوس','إنتر','برشلونة','ميلان','باريس','مانشستر يونايتد','ميلان']},
{name:'محمد صلاح',c:['المقاولون العرب','بازل','تشيلسي','فيورنتينا','روما','ليفربول']},
{name:'أنخيل دي ماريا',c:['روزاريو سنترال','بنفيكا','ريال مدريد','مانشستر يونايتد','باريس','يوفنتوس','بنفيكا']},
{name:'لويس سواريز',c:['ناسيونال','جرونينجن','أياكس','ليفربول','برشلونة','أتلتيكو مدريد','ناسيونال']},
{name:'صامويل إيتو',c:['ريال مدريد','مايوركا','برشلونة','إنتر','آنجي','تشيلسي','إيفرتون']},
{name:'أندريا بيرلو',c:['بريشيا','إنتر','ميلان','يوفنتوس','نيويورك سيتي']}
];
const auctionGlobal=[['كيليان مبابي','هاري كين'],['جود بيلينجهام','رودري'],['فينيسيوس جونيور','عثمان ديمبيلي'],['إيرلينج هالاند','روبرت ليفاندوفسكي'],['تيبو كورتوا','أليسون بيكر'],['فيرجيل فان دايك','روبن دياز']];
const auctionLocal=[['محمد الشناوي','عصام الحضري'],['أحمد حجازي','علي معلول'],['إمام عاشور','عبدالله السعيد'],['زيزو','حسين الشحات'],['عمر مرموش','مصطفى محمد'],['أفشة','عمر السولية']];
function title(t){brand.textContent=t;back.style.display='block';currentHome=false}
function goHome(){if(timer){clearInterval(timer);timer=null}brand.textContent='👑 Eslam Games ⚽';back.style.display='none';currentHome=true;home()}
back.onclick=goHome;
function home(){
app.innerHTML='<div class="menu"></div>';
const games=[['🧢','أنا مين',who],['💰','المزايدة واللاعب المخفي',auction],['🔁','الانتقالات المعقدة',trans],['📸','مين اللاعب؟ — صورة واحدة',photoGame],['🔟','سمّي ١٠',topTen],['⚽','إكس أو بالكورة',xo],['🥅','ضربات جزاء',pen],['🔴','كونكت فور',connect4],['📋','سكور شيت',score],['⚙️','الإعدادات',settings]];
games.forEach(g=>{const b=document.createElement('button');b.className='gamebtn';b.innerHTML='<span class="ico">'+g[0]+'</span><span>'+g[1]+'</span>';b.onclick=()=>{title(g[1]);g[2]()};$('.menu').appendChild(b)});
}
function getCustom(){try{return JSON.parse(localStorage.getItem('eg_custom_players')||'[]')}catch{return[]}}
function who(){
let D=players.concat(getCustom().map(x=>({name:x.name,h:x.hints||[]})));
let chosen=shuffle(D).slice(0,Math.min(10,D.length));app.innerHTML='<div class="panel"><div class="title">🧢 أنا مين</div><div class="sub">التلميحات من الأصعب إلى الأسهل — حاول تجاوب قبل آخر تلميح.</div></div>';
chosen.forEach((p,i)=>{const c=document.createElement('div');c.className='panel';let hs=shuffle(p.h).map((h,j)=>'<div class="hint">💡 '+h+'</div>').join('');c.innerHTML='<div class="row"><span class="badge">السؤال '+(i+1)+'</span><span class="badge">صعب ← سهل</span></div>'+hs+'<div class="answer hidden">الإجابة: '+p.name+'</div><button class="btn gold" style="width:100%">👁 إظهار الإجابة</button>';c.querySelector('button').onclick=()=>{const a=c.querySelector('.answer');a.classList.toggle('hidden');c.querySelector('button').textContent=a.classList.contains('hidden')?'👁 إظهار الإجابة':'إخفاء الإجابة'};app.appendChild(c)})
}
function auction(){
app.innerHTML='<div class="panel"><div class="title">💰 المزايدة</div><div class="row"><input id="a1" value="إسلام" placeholder="اللاعب الأول"><input id="a2" value="أحمد" placeholder="اللاعب الثاني"></div><div class="row"><select id="cat"><option value="global">عالميين 🌍</option><option value="local">مصريين 🇪🇬</option><option value="mix">ميكس 🏆</option></select><button class="btn gold" id="startA">ابدأ — 100M لكل لاعب</button></div></div>';
$('#startA').onclick=()=>auctionPlay($('#a1').value||'إسلام',$('#a2').value||'أحمد',$('#cat').value)}
function auctionPlay(p1,p2,cat){let bal=[100,100],teams=[[],[]],round=0;let db=cat==='local'?auctionLocal:cat==='global'?auctionGlobal:shuffle([...auctionGlobal,...auctionLocal]);
function roundView(){if(round>=5)return finish();let pair=shuffle(db[round%db.length]);let pos=['حارس','مدافع','وسط','جناح','مهاجم'][round];app.innerHTML='<div class="panel"><div class="row"><span class="badge">الجولة '+(round+1)+' / 5</span><span class="badge">'+pos+'</span></div><div class="card">⚽ '+pair[0]+'</div><div class="panel" style="margin-top:10px;border-style:dashed;text-align:center">🔒 اللاعب المخفي: ❓</div><div class="scoreline"><b>'+p1+'</b><span>'+bal[0]+'M</span></div><div class="scoreline"><b>'+p2+'</b><span>'+bal[1]+'M</span></div><div class="row"><select id="winner"><option value="0">الفائز: '+p1+'</option><option value="1">الفائز: '+p2+'</option></select><input id="price" type="number" min="0" placeholder="السعر M"><button class="btn gold" id="buy">تأكيد</button></div></div>';
$('#buy').onclick=()=>{let w=+$('#winner').value,price=Number($('#price').value);if(!Number.isFinite(price)||price<0)return alert('اكتب سعر صحيح');if(price>bal[w])return alert('السعر أكبر من الرصيد المتاح');bal[w]-=price;let l=1-w;teams[w].push(pair[0]+' — '+price+'M');teams[l].push(pair[1]+' — مخفي مجاني');app.innerHTML='<div class="panel center"><div class="title">🎉 تمت المزايدة</div><p>'+ (w? p2:p1)+' اشترى '+pair[0]+' بـ '+price+'M</p><div class="answer">🔓 اللاعب المخفي لـ '+(l?p2:p1)+' هو<br>'+pair[1]+'</div><button class="btn gold" id="next" style="width:100%">الجولة التالية</button></div>';$('#next').onclick=()=>{round++;roundView()}}}
function finish(){app.innerHTML='<div class="panel"><div class="title">🏁 النتيجة النهائية</div><div class="scoreline"><b>'+p1+'</b><span>'+bal[0]+'M</span></div>'+teams[0].map(x=>'<div class="hint">'+x+'</div>').join('')+'<div class="scoreline"><b>'+p2+'</b><span>'+bal[1]+'M</span></div>'+teams[1].map(x=>'<div class="hint">'+x+'</div>').join('')+'<button class="btn gold" id="again" style="width:100%">جولة جديدة</button></div>';$('#again').onclick=()=>auction()}
roundView()}
function trans(){let D=shuffle(transfers).slice(0,Math.min(6,transfers.length));app.innerHTML='<div class="panel"><div class="title">🔁 الانتقالات المعقدة</div><div class="sub">مين اللاعب اللي مرّ بالأندية دي؟</div></div>';D.forEach((p,i)=>{let c=document.createElement('div');c.className='panel';c.innerHTML='<div class="row"><span class="badge">السؤال '+(i+1)+'</span></div><div class="path">'+p.c.map((x,j)=>'<span class="club">'+x+'</span>'+(j<p.c.length-1?'<span class="arrow">←</span>':'')).join('')+'</div><div class="answer hidden">الإجابة: '+p.name+'</div><button class="btn gold" style="width:100%">👁 كشف اللاعب</button>';c.querySelector('button').onclick=()=>{let a=c.querySelector('.answer');a.classList.toggle('hidden')};app.appendChild(c)})}
const photoPlayers=[['محمد صلاح','https://upload.wikimedia.org/wikipedia/commons/c/c1/Mohamed_Salah_2018.jpg'],['كريستيانو رونالدو','https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg'],['ليونيل ميسي','https://upload.wikimedia.org/wikipedia/commons/b/b4/Lionel-Messi-Argentina-2022-World-Cup_%28cropped%29.jpg'],['كيليان مبابي','https://upload.wikimedia.org/wikipedia/commons/5/5c/Kylian_Mbappe_2019.jpg']];
function photoGame(){let p=shuffle(photoPlayers)[0];app.innerHTML='<div class="panel center"><div class="title">📸 مين اللاعب؟</div><p class="sub">كل لاعب يمسك الموبايل لوحده ويحاول يعرف اللاعب من الصورة.</p><img class="photo" alt="صورة لاعب" src="'+p[1]+'"><div id="pa" class="answer hidden">اللاعب هو: '+p[0]+'</div><div class="row"><button class="btn gold" id="reveal">كشف الاسم</button><button class="btn" id="nextPhoto">صورة جديدة</button></div></div>';$('#reveal').onclick=()=>$('#pa').classList.toggle('hidden');$('#nextPhoto').onclick=photoGame}
function topTen(){const cats=['أندية مصرية','لاعبين برازيليين','مدربين كبار','ملاعب كرة قدم','منتخبات أفريقية','أندية إنجليزية','لاعبين لعبوا لريال مدريد','لاعبين مصريين محترفين'];let left=60,count=0,cat='';app.innerHTML='<div class="panel center"><div class="title">🔟 سمّي ١٠</div><div class="sub">اختار فئة، ثم عند كل إجابة صحيحة اضغط +1.</div><div class="card" id="tc">—</div><div class="big" id="time">60</div><div class="big" id="count">0 / 10</div><div class="row"><button class="btn gold" id="go">ابدأ</button><button class="btn" id="plus" disabled>+١ إجابة صح</button><button class="btn" id="newcat" disabled>فئة أخرى</button></div></div>';function newcat(){cat=shuffle(cats)[0];$('#tc').textContent=cat;count=0;$('#count').textContent='0 / 10'}$('#go').onclick=()=>{left=60;newcat();$('#go').disabled=true;$('#plus').disabled=false;$('#newcat').disabled=false;$('#time').textContent=left;if(timer)clearInterval(timer);timer=setInterval(()=>{left--;$('#time').textContent=left;if(left<=0){clearInterval(timer);timer=null;$('#plus').disabled=true;$('#go').disabled=false;alert('الوقت خلص! النتيجة '+count+' / 10')}},1000)};$('#plus').onclick=()=>{if(count<10)count++;$('#count').textContent=count+' / 10';if(count===10){clearInterval(timer);timer=null;$('#plus').disabled=true;$('#go').disabled=false;alert('🏆 كملت الـ10!')}};$('#newcat').onclick=newcat}
function xo(){let b=Array(9).fill(''),t='⚽',over=false,L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];app.innerHTML='<div class="panel center"><div class="title">⚽ إكس أو بالكورة</div><div id="xst" class="sub">الدور على ⚽</div><div class="xo" id="xg"></div><button class="btn gold" id="xr">ماتش جديد</button></div>';const g=$('#xg');function draw(){g.innerHTML='';b.forEach((v,i)=>{let q=document.createElement('button');q.textContent=v;q.onclick=()=>{if(over||b[i])return;b[i]=t;if(L.some(l=>l.every(k=>b[k]===t))){over=true;$('#xst').textContent='🏆 الفائز: '+t}else if(b.every(Boolean)){over=true;$('#xst').textContent='تعادل 🤝'}else{t=t==='⚽'?'🥅':'⚽';$('#xst').textContent='الدور على '+t}draw()};g.appendChild(q)})}$('#xr').onclick=xo;draw()}
function pen(){let n=0,s=0,res=[];app.innerHTML='<div class="panel center"><div class="title">🥅 ضربات جزاء</div><div id="ps">اختار مكان التسديدة — 5 ضربات</div><div class="goal" id="goal">🧤</div><div class="dots" id="dots"></div><div class="row" id="dirs"></div><button class="btn gold hidden" id="pr">ماتش جديد</button></div>';['شمال','وسط','يمين'].forEach((x,i)=>{let b=document.createElement('button');b.className='btn';b.textContent=['⬅️','⬆️','➡️'][i]+' '+x;b.onclick=()=>{let k=Math.floor(Math.random()*3),ok=k!==i;n++;if(ok)s++;res.push(ok?'⚽':'❌');$('#goal').textContent=ok?'⚽ جوووول':'🧤 الحارس صدّها';$('#dots').textContent=res.join(' ');if(n===5){$('#ps').textContent='النتيجة: '+s+' من 5';$('#dirs').innerHTML='';$('#pr').classList.remove('hidden')}else $('#ps').textContent='الضربة '+(n+1)+' من 5'};$('#dirs').appendChild(b)});$('#pr').onclick=pen}
function connect4(){const R=6,C=7;let b=Array.from({length:R},()=>Array(C).fill('')),t='r',over=false;app.innerHTML='<div class="panel center"><div class="title">🔴 كونكت فور</div><div id="cs">الدور على الأحمر</div><div class="c4" id="cg"></div><button class="btn gold" id="cr">ماتش جديد</button></div>';const g=$('#cg');function win(r,c){return [[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>{let n=1;for(let s of [1,-1]){let i=r+dr*s,j=c+dc*s;while(i>=0&&i<R&&j>=0&&j<C&&b[i][j]===t){n++;i+=dr*s;j+=dc*s}}return n>=4})}function draw(){g.innerHTML='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){let q=document.createElement('button');q.className=b[r][c];q.onclick=()=>{if(over)return;let i=R-1;while(i>=0&&b[i][c])i--;if(i<0)return;b[i][c]=t;if(win(i,c)){over=true;$('#cs').textContent='🏆 فاز '+(t==='r'?'الأحمر':'الأصفر')}else if(b[0].every(Boolean)){over=true;$('#cs').textContent='تعادل 🤝'}else{t=t==='r'?'y':'r';$('#cs').textContent='الدور على '+(t==='r'?'الأحمر':'الأصفر')}draw()};g.appendChild(q)}}$('#cr').onclick=connect4;draw()}
function score(){let P=[];try{P=JSON.parse(readLS('eg_score','[]')||'[]');if(!Array.isArray(P))P=[]}catch(e){P=[]}app.innerHTML='<div class="panel"><div class="title">📋 سكور شيت</div><div class="row"><input id="sn" placeholder="اسم لاعب أو فريق"><button class="btn gold" id="sa">أضف</button></div><div id="sl" class="list"></div><button class="btn red" id="sz" style="width:100%;margin-top:10px">تصفير النقاط</button></div>';function draw(){let l=$('#sl');l.innerHTML='';P.forEach((p,i)=>{let d=document.createElement('div');d.className='playerrow';d.innerHTML='<b>'+p.n+'</b><button class="btn">−</button><strong>'+p.s+'</strong><button class="btn gold">+</button>';let bs=d.querySelectorAll('button');bs[0].onclick=()=>{p.s--;save();draw()};bs[1].onclick=()=>{p.s++;save();draw()};l.appendChild(d)})}function save(){writeLS('eg_score',JSON.stringify(P))}function add(){let v=$('#sn').value.trim();if(!v)return;P.push({n:v,s:0});$('#sn').value='';save();draw()}$('#sa').onclick=add;$('#sn').onkeydown=e=>{if(e.key==='Enter')add()};$('#sz').onclick=()=>{P.forEach(x=>x.s=0);save();draw()};draw()}
function settings(){app.innerHTML='<div class="panel"><div class="title">⚙️ الإعدادات</div><div class="row"><button class="btn toggle" id="sound">🔊 الأصوات: '+(state.sound?'مفعلة':'مكتومة')+'</button><button class="btn toggle" id="theme">🌙 تغيير المظهر</button></div><hr style="border-color:#277f45"><div class="title" style="font-size:20px">➕ إضافة لاعب لـ أنا مين</div><input id="pn" placeholder="اسم اللاعب" style="width:100%;margin:5px 0"><input id="ph" placeholder="3 أو 4 تلميحات مفصولة بعلامة |" style="width:100%;margin:5px 0"><button class="btn gold" id="addp" style="width:100%">إضافة</button><div id="custom" class="list" style="margin-top:12px"></div><button class="btn red" id="clear" style="width:100%;margin-top:14px">مسح اللاعبين المضافين</button></div>';$('#sound').onclick=()=>{state.sound=!state.sound;writeLS('eg_sound',String(state.sound));settings()};$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';writeLS('eg_theme',state.theme);document.documentElement.dataset.theme=state.theme;document.body.style.filter=state.theme==='light'?'brightness(1.15)':'none'};$('#addp').onclick=()=>{let n=$('#pn').value.trim(),h=$('#ph').value.split('|').map(x=>x.trim()).filter(Boolean);if(!n||h.length<2)return alert('اكتب الاسم وتلميحين على الأقل');let a=getCustom();a.push({name:n,hints:h});writeLS('eg_custom_players',JSON.stringify(a));settings()};$('#clear').onclick=()=>{if(confirm('مسح اللاعبين المضافين فقط؟')){try{localStorage.removeItem('eg_custom_players')}catch(e){};settings()}};let a=getCustom();$('#custom').innerHTML=a.length?a.map((x,i)=>'<div class="playerrow"><b>'+x.name+'</b><button class="btn red" data-i="'+i+'">حذف</button></div>').join(''):'<div class="small center">لا يوجد لاعبين مضافين.</div>';$('#custom').querySelectorAll('button').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.i,1);writeLS('eg_custom_players',JSON.stringify(a));settings()})}
if(state.theme==='light')document.documentElement.dataset.theme='light';
home();
</script>
