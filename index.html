<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
 background:repeating-linear-gradient(90deg,var(--grass) 0 56px,var(--grass2) 56px 112px)}

main{flex:1;overflow-y:auto;padding:18px 14px 28px;max-width:560px;width:100%;margin:0 auto}
.menu button{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:18px;width:100%;min-height:148px;margin:0 0 16px;padding:12px 16px;background:linear-gradient(135deg,var(--dark),#111a24);color:var(--ink);border:3px solid var(--line);border-radius:22px;font:800 21px Tajawal,sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.22)}

button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--dark);color:#fff;border:3px solid var(--line);border-radius:14px;padding:11px 18px;font:800 18px Tajawal,sans-serif;cursor:pointer}

.status{text-align:center;font-size:22px;font-weight:800;min-height:34px;margin:6px 0 14px}
.board{background:var(--dark);border:3px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr;max-width:340px;margin:0 auto}
.xo button{aspect-ratio:1;background:var(--dark);border:3px solid var(--line);border-radius:14px;font-size:46px;color:#fff;cursor:pointer;padding:0}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;direction:ltr;background:var(--dark);border:3px solid var(--line);padding:8px;border-radius:14px;max-width:420px;margin:0 auto}
.c4 button{aspect-ratio:1;border-radius:50%;border:0;background:var(--grass);padding:0;cursor:pointer}

.card{background:var(--dark);border:3px solid var(--line);border-radius:22px;min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:36px;font-weight:800;padding:20px;margin:10px 0}
.big{font-size:46px;font-weight:800;text-align:center}
.goal{position:relative;height:150px;border:3px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;margin:10px auto;max-width:360px;background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.18) 10px 11px);font-size:60px;display:flex;align-items:center;justify-content:center}
.dirs .btn{flex:1;min-width:90px}
.dots{font-size:26px;letter-spacing:4px;text-align:center;min-height:40px}
.sheet .p{display:flex;align-items:center;gap:8px;background:var(--dark);border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.sheet .p b{flex:1;font-size:19px}.sheet .p span{font-size:28px;font-weight:800;min-width:44px;text-align:center}
.sheet .p button{width:42px;height:42px;border-radius:50%;border:0;font-size:24px;font-weight:800;background:var(--gold);color:#222;cursor:pointer}
input{font:500 18px Tajawal,sans-serif;padding:12px;border-radius:12px;border:3px solid var(--line);background:var(--dark);color:#fff;flex:1;min-width:0}
input::placeholder{color:#b9dcc3}
.soonmsg{text-align:center;margin-top:40px;font-size:22px;font-weight:700}

:root{--panel:#f2fbf4;--ptext:#0e3d1f;--pline:#8fd0a5;--pfill:#e3f6e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#0c3a1c;--ptext:#e6f7ea;--pline:#2f7d4a;--pfill:#0f4a24}}

.panel{background:var(--panel);color:var(--ptext);border-radius:26px;padding:18px;margin-bottom:18px}
.trow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ttl{font-size:26px;font-weight:800}
.pill{background:var(--dark);color:#fff;border-radius:40px;padding:12px 28px;font-size:34px;font-weight:800;letter-spacing:3px;direction:ltr}

.chip{width:max-content;margin:6px auto;padding:6px 16px;border-radius:20px;background:var(--pfill);font-weight:700}

.note{text-align:center;font-weight:700;margin:6px 0 0}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.badge{background:var(--pfill);border:2px solid var(--pline);border-radius:20px;padding:6px 16px;font-weight:800}
.ic{width:52px;height:52px;border-radius:14px;background:#fb8c00;display:flex;align-items:center;justify-content:center;font-size:28px}
.h{border:2px solid var(--pline);background:var(--pfill);border-radius:14px;padding:16px;margin-bottom:12px;font-size:18px;font-weight:700}
.path{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0 16px}
.cl{background:var(--pfill);border:2px solid var(--pline);border-radius:12px;padding:8px 12px;font-weight:800}
.ar{font-size:22px;font-weight:800}
.ask{text-align:center;font-weight:800;font-size:19px;margin:4px 0}
.ans{background:var(--gold);color:#222;border-radius:14px;padding:14px;text-align:center;font-size:26px;font-weight:800;margin:6px 0 12px}
.row2{display:flex;gap:10px}.row2 .wide{flex:1}.row2 .rf{flex:0 0 64px;font-size:26px;padding:8px}
.btn.sel{background:var(--gold)!important;color:#222!important;border-color:var(--gold)!important}.pcard{min-height:120px;font-size:34px}.tm{margin-bottom:14px}.tm b{display:block;font-size:20px;margin-bottom:6px}

:root{--gold:#ffd54a;--neon:#00e5ff;--purple:#7c4dff}
body{background:radial-gradient(circle at 20% 0%,#17113b 0,#080812 38%,#050509 100%);}
header{background:linear-gradient(135deg,#08080d,#12102a 55%,#09090f);border-bottom:1px solid rgba(255,213,74,.28);box-shadow:0 8px 35px rgba(0,0,0,.35)}

.heroLogo .bigLogo{font-size:44px;font-weight:1000;letter-spacing:1px;background:linear-gradient(90deg,#fff 15%,var(--gold) 50%,var(--neon) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 35px rgba(0,229,255,.18)}.heroAccessory{display:flex;justify-content:center;align-items:center;gap:22px;font-size:30px;margin-bottom:2px}.heroAccessory b{font-size:18px;color:var(--gold);text-shadow:0 0 18px var(--gold)}.heroLine{height:2px;width:130px;margin:10px auto 6px;background:linear-gradient(90deg,transparent,var(--gold),var(--neon),transparent);box-shadow:0 0 14px rgba(0,229,255,.35)}.heroLogo p{letter-spacing:3px;font-size:11px}.bidBox{border:1px solid var(--pline);background:rgba(255,255,255,.3);border-radius:18px;padding:12px}.photoSolo{text-align:center;background:#0e0e18;border:1px solid #29293a;border-radius:22px;padding:14px;margin:12px 0}.roleBadge{display:inline-block;padding:7px 14px;border-radius:20px;background:var(--gold);color:#222;font-weight:900;margin-bottom:10px}.myPlayer{width:min(100%,390px);aspect-ratio:1;object-fit:cover;border-radius:20px;display:block;margin:auto;box-shadow:0 0 35px rgba(0,229,255,.12)}
.heroLogo p{margin:7px 0 0;color:#a9a9bd;font-weight:700}
.homeTools{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:0 auto 16px}
.homeTools .mini{width:auto;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#fff;font-weight:800}
.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.phone{padding:14px;border-radius:22px;background:#0e0e18;border:1px solid #29293a;text-align:center}.phone img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:18px;background:#191925}.phone h3{margin:10px 0 5px}.hiddenPlayer{filter:blur(18px);transform:scale(1.03)}

<body>
<header><button id="back" aria-label="رجوع">&#8250;</button><div class="brand" onclick="home()"><div class="brandMark">⚽</div><div><div class="brandText">ESLAM GAMES</div><span class="brandSub">FOOTBALL • PARTY • CHALLENGE</span></div></div></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let tm=null;
let USEDN=[];try{USEDN=JSON.parse(localStorage.getItem('eg_used')||'[]')}catch(e){}
const saveU=()=>{try{localStorage.setItem('eg_used',JSON.stringify(USEDN))}catch(e){}};
const nz=n=>String(n).replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[()]/g,' ').trim().split(/\s+/).filter(Boolean);
const same=(a,b)=>{const x=nz(a),y=nz(b),m=x.length<=y.length,sm=m?x:y,lg=m?y:x;return sm.length>0&&sm.every(t=>lg.includes(t))&&!(sm.length===1&&sm[0].length<3)};
const U={has:n=>USEDN.some(u=>same(u,n)),add:n=>{if(!U.has(n)){USEDN.push(n);saveU()}},del:n=>{USEDN=USEDN.filter(u=>!same(u,n));saveU()}};
let EXH=false;
const fresh=(arr,k=x=>x.n)=>{let a=arr.filter(x=>!U.has(k(x)));if(!a.length){EXH=true;arr.forEach(x=>U.del(k(x)));a=arr}const x=a[Math.floor(Math.random()*a.length)];U.add(k(x));return x};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.more');if(!b)return;const h=b.parentElement.querySelector('.h[hidden]');if(h)h.hidden=false;if(!b.parentElement.querySelector('.h[hidden]'))b.remove()});

let AUTO=[];try{AUTO=JSON.parse(localStorage.getItem('eg_auto')||'[]')}catch(e){}
const WDQ='https://query.wikidata.org/sparql?format=json&query=';
async function wdq(q){const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);try{const r=await fetch(WDQ+encodeURIComponent(q),{signal:c.signal});if(!r.ok)throw new Error(r.status);return (await r.json()).results.bindings}finally{clearTimeout(t)}}
const q1=o=>'SELECT ?p ?n ?dob ?bn ?pn ?img WHERE{?p wdt:P106 wd:Q937857;wdt:P569 ?dob;wdt:P19 ?b;wdt:P413 ?pos;wikibase:sitelinks ?sl. FILTER(?sl>=25&&?sl<=90) FILTER(?dob>"1985-01-01T00:00:00Z"^^xsd:dateTime) ?p rdfs:label ?n. FILTER(LANG(?n)="ar") ?b rdfs:label ?bn. FILTER(LANG(?bn)="ar") ?pos rdfs:label ?pn. FILTER(LANG(?pn)="ar") OPTIONAL{?p wdt:P18 ?img}} LIMIT 30 OFFSET '+o;
const q2=ids=>'SELECT ?p ?cn ?s WHERE{VALUES ?p{'+ids.map(i=>'wd:'+i).join(' ')+'} ?p p:P54 ?st. ?st ps:P54 ?c. OPTIONAL{?st pq:P580 ?s} ?c rdfs:label ?cn. FILTER(LANG(?cn)="ar")}';
async function refill(){
  if(refill.b||navigator.onLine===false)return;refill.b=1;
  try{
    if(AUTO.filter(x=>!U.has(x.n)).length>=150)return;
    for(let t=0;t<3;t++){
      const A=await wdq(q1(Math.floor(Math.random()*2500))),m=new Map();
      A.forEach(r=>{const id=r.p.value.split('/').pop();if(!m.has(id)&&!AUTO.some(x=>x.id===id))m.set(id,{id,n:r.n.value,y:+r.dob.value.slice(0,4),b:r.bn.value,p:r.pn.value,img:r.img?r.img.value:null,c:[]})});
      if(!m.size)continue;
      const by={};(await wdq(q2([...m.keys()]))).forEach(r=>{const id=r.p.value.split('/').pop();(by[id]=by[id]||[]).push([r.s?r.s.value:'9999',r.cn.value])});
      m.forEach((o,id)=>{const cl=(by[id]||[]).filter(x=>!/منتخب|تحت/.test(x[1])).sort((a,b)=>a[0]<b[0]?-1:1).map(x=>x[1]),u=cl.filter((x,i)=>cl.indexOf(x)===i);if(u.length>=3&&o.y>1984&&o.y<2010){o.c=u.slice(0,9);AUTO.push(o)}});
      AUTO=AUTO.slice(-800);try{localStorage.setItem('eg_auto',JSON.stringify(AUTO))}catch(e){}
    }
  }catch(e){console.warn('auto refill failed',e)}finally{refill.b=0}
}
let LIVE_DATA={who:[],trans:[],auction:[],updatedAt:null};
async function loadLiveData(){try{const r=await fetch('data/live.json?x='+Date.now(),{cache:'no-store'});if(r.ok)LIVE_DATA=await r.json()}catch(e){console.warn('live data unavailable',e)}}
const sv=(k,b)=>'<svg viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="'+k+'g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe58a"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient><linearGradient id="'+k+'c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8ff6ff"/><stop offset="1" stop-color="#14a0c8"/></linearGradient><radialGradient id="'+k+'w" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9d6dd"/></radialGradient></defs>'+b+'</svg>';
const ball=(k,x,y,r)=>{let p=[],l='';for(let i=0;i<5;i++){const a=(-90+72*i)*Math.PI/180,c=Math.cos(a),n=Math.sin(a),f=v=>v.toFixed(1);p.push(f(x+r*.42*c)+','+f(y+r*.42*n));l+='<line x1="'+f(x+r*.42*c)+'" y1="'+f(y+r*.42*n)+'" x2="'+f(x+r*.86*c)+'" y2="'+f(y+r*.86*n)+'"/>'}return '<g stroke="#1b2733" stroke-width="'+Math.max(1.2,r/12).toFixed(1)+'" stroke-linejoin="round"><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#'+k+'w)"/><polygon points="'+p.join(' ')+'" fill="#1b2733"/>'+l+'</g>'};
const c4i=(()=>{let o='';const col={'0,3':'g','1,2':'g','2,1':'g','3,0':'g','1,3':'r','2,3':'r','0,2':'r'};for(let r=0;r<4;r++)for(let c=0;c<4;c++){const k=col[c+','+r];o+='<circle cx="'+(26+c*16)+'" cy="'+(26+r*16)+'" r="6.5" fill="'+(k==='g'?'url(#c4g)':k==='r'?'#ff5a4d':'#0b2a3a')+'"/>'}return o})();

 ball:sv('a',ball('a',48,48,38)),

 'المزايدة':sv('m','<g transform="rotate(-35 44 38)"><rect x="40" y="36" width="9" height="48" rx="4.5" fill="#c98a4b"/><rect x="20" y="14" width="48" height="24" rx="7" fill="url(#mc)"/><rect x="20" y="14" width="48" height="8" rx="4" fill="#fff" fill-opacity=".35"/></g><rect x="10" y="82" width="52" height="8" rx="4" fill="#fff" fill-opacity=".85"/><circle cx="70" cy="68" r="19" fill="url(#mg)" stroke="#b36a00" stroke-width="2"/><circle cx="70" cy="68" r="13.5" fill="none" stroke="#b36a00" stroke-opacity=".5" stroke-width="2"/><text x="70" y="76" text-anchor="middle" font-size="22" font-weight="900" font-family="Tajawal,sans-serif" fill="#7a4300">$</text>'),

function xo(){
  let b=Array(9).fill(''),t='⚽',over=false;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  app.innerHTML='<div class="status" id="st">الدور على: ⚽</div><div class="xo" id="g"></div><div class="row"><button class="btn" id="rs">ماتش جديد</button></div>';
  const st=$('#st'),g=$('#g');
  function draw(){g.innerHTML='';b.forEach((v,i)=>{const c=document.createElement('button');c.textContent=v;c.setAttribute('aria-label','خانة '+(i+1));
    c.onclick=()=>{if(over||b[i])return;b[i]=t;
      if(L.some(l=>l.every(k=>b[k]===t))){over=true;st.textContent='🏆 الفايز: '+t}
      else if(b.every(Boolean)){over=true;st.textContent='تعادل 🤝'}
      else{t=t==='⚽'?'🥅':'⚽';st.textContent='الدور على: '+t}draw()};g.appendChild(c)})}
  $('#rs').onclick=xo;draw();
}

function timerCard(onReset){
  let left=60,run=false;
  const el=document.createElement('div');el.className='panel';
  el.innerHTML='<div class="trow"><div class="ttl">⏱ المؤقت</div><div class="pill">1:00</div></div><div class="row"><button class="btn g" data-a="go">▶ بدء</button><button class="btn" data-a="ps" disabled>⏸ إيقاف</button><button class="btn" data-a="rs">↻ إعادة</button></div><div style="text-align:center"><span class="chip">متوقف</span></div><p class="note">تقدر تغير اللاعب مرة واحدة فقط</p>';
  const q=s=>el.querySelector(s),b=a=>q('[data-a='+a+']');
  function upd(){q('.pill').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    const c=q('.chip');c.textContent=run?'شغال':left===0?'الوقت خلص':'متوقف';c.className='chip'+(run?' on':left===0?' end':'');
    b('go').disabled=run||left===0;b('ps').disabled=!run}
  b('go').onclick=()=>{run=true;upd();clearInterval(tm);tm=setInterval(()=>{left--;if(left<=0){left=0;run=false;clearInterval(tm)}upd()},1000)};
  b('ps').onclick=()=>{run=false;clearInterval(tm);upd()};
  b('rs').onclick=()=>{clearInterval(tm);run=false;left=60;upd();onReset()};
  return el;
}

  app.innerHTML='<div class="status" id="st">الدور على الأحمر</div><div class="c4" id="g"></div><div class="row"><button class="btn" id="rs">ماتش جديد</button></div>';
  const st=$('#st'),g=$('#g');
  const win=(r,c)=>[[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>{let n=1;for(const s of[1,-1]){let i=r+dr*s,j=c+dc*s;while(b[i]&&b[i][j]===t){n++;i+=dr*s;j+=dc*s}}return n>=4});
  function draw(){g.innerHTML='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=document.createElement('button');x.className=b[r][c];x.setAttribute('aria-label','عمود '+(c+1));
    x.onclick=()=>{if(over)return;let i=R-1;while(i>=0&&b[i][c])i--;if(i<0)return;b[i][c]=t;
      if(win(i,c)){over=true;st.textContent='🏆 فاز '+nm[t]}else if(b[0].every(Boolean)){over=true;st.textContent='تعادل 🤝'}
      else{t=t==='r'?'y':'r';st.textContent='الدور على '+nm[t]}draw()};g.appendChild(x)}}
  $('#rs').onclick=c4;draw();
}

function score(){
  let P=JSON.parse(localStorage.getItem('eg_scores')||'[]');
  app.innerHTML='<div class="panel"><div class="ttl">🏆 لوحة نقاط الشلة</div><p class="note">أضف أسماء اللاعبين، وكل فوز زوّد نقطة. البيانات بتفضل محفوظة على الموبايل.</p><div class="row" style="margin-top:0"><input id="nm" placeholder="اسم اللاعب"><button class="btn" id="ad">أضف</button></div><div class="sheet" id="ls"></div><div class="row"><button class="btn" id="z">↺ تصفير النقاط</button><button class="btn" id="clearP">🗑 مسح اللاعبين</button></div></div>';
  const ls=$('#ls');
  function save(){localStorage.setItem('eg_scores',JSON.stringify(P))}
  function draw(){ls.innerHTML='';P.sort((a,b)=>b.s-a.s).forEach((p,i)=>{const d=document.createElement('div');d.className='p';d.innerHTML='<b></b><button aria-label="زود">+</button><span>'+p.s+'</span><button aria-label="نقّص">&minus;</button>';d.firstChild.textContent=(i===0&&p.s>0?'👑 ':'')+p.n;const bs=d.querySelectorAll('button');bs[0].onclick=()=>{p.s++;save();draw()};bs[1].onclick=()=>{p.s=Math.max(0,p.s-1);save();draw()};ls.appendChild(d)})}
  const add=()=>{const v=$('#nm').value.trim();if(!v||P.some(p=>p.n===v))return;P.push({n:v,s:0});$('#nm').value='';save();draw()};
  $('#ad').onclick=add;$('#nm').onkeydown=e=>{if(e.key==='Enter')add()};$('#z').onclick=()=>{P.forEach(p=>p.s=0);save();draw()};$('#clearP').onclick=()=>{if(confirm('تمسح كل أسماء اللاعبين؟')){P=[];save();draw()}};draw();
}
home();
</script>
