<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي الشلة - كورة V5</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;1000&display=swap" rel="stylesheet">
<style>
:root{--grass:#1f8a43;--dark:#0e4d24;--line:#f4fff6;--ink:#fff;--gold:#ffd54f;--red:#ff5a4d;--neon:#00e5ff;--purple:#7c4dff;--card-bg:#121029}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dark:#083a1b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
 background:radial-gradient(circle at 20% 0%,#17113b 0,#080812 38%,#050509 100%);background-attachment:fixed}
header{background:linear-gradient(135deg,#08080d,#12102a 55%,#09090f);border-bottom:1px solid rgba(255,213,74,.28);box-shadow:0 8px 35px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;position:relative;min-height:66px;padding-top:env(safe-area-inset-top,0px)}
#back{position:absolute;right:12px;bottom:12px;background:none;border:0;color:var(--ink);font-size:32px;line-height:1;cursor:pointer;display:none}
main{flex:1;overflow-y:auto;padding:18px 14px 28px;max-width:560px;width:100%;margin:0 auto}

/* أنيميشن ناعم */
.fade-in{animation:fadeIn 0.25s ease-in-out}
@keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}

/* القائمة الرئيسية واحترافية الأزرار */
.menu button{display:flex;align-items:center;justify-content:flex-start;gap:18px;width:100%;height:85px;margin:0 0 14px;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.01));color:var(--ink);border:2px solid rgba(255,255,255,.12);border-radius:22px;font:800 22px Tajawal,sans-serif;cursor:pointer;padding:0 20px;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:all 0.2s}
.menu button:active{transform:scale(0.97);border-color:var(--neon)}
.menu button i{font-style:normal;font-size:42px;line-height:1;display:flex;align-items:center;justify-content:center;min-width:48px}
.menu button.soon{opacity:.5;border-style:dashed}

.btn{background:var(--dark);color:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 20px;font:800 18px Tajawal,sans-serif;cursor:pointer;transition:0.15s}
.btn:active{transform:scale(0.95)}
.btn:disabled{opacity:.4;transform:none}
.btn.g{background:linear-gradient(135deg,#2e7d32,#1b5e20);border-color:#81c784}
.btn.gold{background:linear-gradient(135deg,#f57f17,#fbc02d);color:#111;border-color:var(--gold)}

.row{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap}
.status{text-align:center;font-size:22px;font-weight:800;min-height:34px;margin:6px 0 14px}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr;max-width:340px;margin:0 auto}
.xo button{aspect-ratio:1;background:var(--card-bg);border:2px solid rgba(255,255,255,.15);border-radius:18px;font-size:46px;color:#fff;cursor:pointer;padding:0}

.panel{background:rgba(18,16,41,0.85);backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:20px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ttl{font-size:26px;font-weight:800;text-align:center;color:var(--gold);margin-bottom:12px}
.pill{background:var(--dark);color:#fff;border-radius:40px;padding:10px 24px;font-size:32px;font-weight:800;direction:ltr;box-shadow:inset 0 0 10px rgba(0,0,0,.5)}
.chip{width:max-content;margin:8px auto;padding:6px 18px;border-radius:20px;background:rgba(255,255,255,.1);font-weight:700}
.chip.on{background:rgba(0,229,255,.2);color:var(--neon)}.chip.end{background:rgba(255,90,77,.2);color:var(--red)}

.h{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:16px;padding:14px;margin-bottom:10px;font-size:17px;font-weight:700;line-height:1.5}
.ans{background:linear-gradient(135deg,var(--gold),#f57f17);color:#111;border-radius:16px;padding:14px;text-align:center;font-size:24px;font-weight:1000;margin:10px 0;box-shadow:0 0 20px rgba(255,213,74,.3)}

/* تصميم كروت "مين اللاعب" التفاعلي */
.photoSolo{text-align:center;background:#080810;border:1px solid rgba(0,229,255,.3);border-radius:24px;padding:16px;margin:12px 0;position:relative;overflow:hidden}
.myPlayer{width:min(100%,310px);aspect-ratio:1;object-fit:cover;border-radius:20px;display:block;margin:auto;box-shadow:0 0 40px rgba(0,229,255,.2);border:2px solid rgba(255,255,255,.15)}

input{font:500 18px Tajawal,sans-serif;padding:12px;border-radius:14px;border:2px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;flex:1;min-width:0}
input::placeholder{color:#888}

.brand{display:flex;align-items:center;gap:12px;direction:ltr;cursor:pointer}
.brandMark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--gold),#ff7a00,var(--neon),var(--purple),var(--gold));box-shadow:0 0 24px rgba(0,229,255,.25);font-size:25px}
.brandText{font-weight:1000;letter-spacing:.5px;font-size:20px;background:linear-gradient(90deg,#fff,var(--gold),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
.brandSub{display:block;font-size:9px;letter-spacing:3px;color:#9b9bb0;margin-top:1px}
.heroLogo{margin:10px auto 20px;max-width:520px;text-align:center;padding:22px 18px;border-radius:28px;background:linear-gradient(145deg,rgba(124,77,255,.15),rgba(0,229,255,.05));border:1px solid rgba(255,213,74,.2)}
.heroLogo .bigLogo{font-size:42px;font-weight:1000;background:linear-gradient(90deg,#fff 15%,var(--gold) 50%,var(--neon) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.heroAccessory{display:flex;justify-content:center;align-items:center;gap:18px;font-size:28px}.heroAccessory b{font-size:18px;color:var(--gold)}
.heroLine{height:2px;width:120px;margin:8px auto;background:linear-gradient(90deg,transparent,var(--gold),var(--neon),transparent)}
.homeTools{display:flex;gap:10px;justify-content:center;margin:0 auto 16px}
.homeTools .mini{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<header><button id="back" aria-label="رجوع">&#8250;</button><div class="brand" onclick="home()"><div class="brandMark">⚽</div><div><div class="brandText">ESLAM GAMES</div><span class="brandSub">FOOTBALL • PARTY • CHALLENGE</span></div></div></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let tm=null;
let LIVE_DATA={who:[],trans:[],auction:[],updatedAt:null};

function playSound(type='click'){
  if(localStorage.getItem('eg_sound')==='off') return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();const g=ctx.createGain();
    osc.connect(g);g.connect(ctx.destination);
    if(type==='win'){osc.frequency.setValueAtTime(523,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(880,ctx.currentTime+0.3);g.gain.fadeOut(0.3);}
    else if(type==='tick'){osc.frequency.setValueAtTime(800,ctx.currentTime);g.gain.fadeOut(0.05);}
    else{osc.frequency.setValueAtTime(320,ctx.currentTime);g.gain.fadeOut(0.08);}
    osc.start();osc.stop(ctx.currentTime+0.3);
  }catch(e){}
}

async function loadLiveData(){try{const r=await fetch('data/live.json?x='+Date.now(),{cache:'no-store'});if(r.ok)LIVE_DATA=await r.json()}catch(e){}}

const GAMES=[
 ['⚽','إكس أو بالكورة',xo],['🥅','ضربات جزاء',pen],['📸','مين اللاعب؟',photoGame],['🧢','أنا مين',who],['🔁','الانتقالات',trans],['💰','المزايدة',auction],['🔟','سمّي ١٠',topTen],['⚙️','الإعدادات',settings]
];

function home(){
  clearInterval(tm);$('#back').style.display='none';
  app.innerHTML='<div class="heroLogo fade-in"><div class="heroAccessory"><span>⚽</span><b>✦</b><span>🏆</span></div><div class="bigLogo">ESLAM GAMES</div><div class="heroLine"></div><p style="margin:5px 0 0;color:#aaa">نسخة القعدات والتحديات V5</p></div><div class="homeTools"><button class="mini" onclick="settings()">⚙️ الإعدادات</button><button class="mini" onclick="photoGame()">📸 مين اللاعب؟</button></div><div class="menu fade-in"></div>';
  GAMES.forEach(g=>{
    const b=document.createElement('button');
    b.innerHTML='<i>'+g[0]+'</i><span>'+g[1]+'</span>';
    b.onclick=()=>{playSound('click');$('#back').style.display='block';g[2]();};
    app.querySelector('.menu').appendChild(b);
  });
}
$('#back').onclick=()=>{playSound('click');home();};
loadLiveData().finally(home);

/* فقرة "مين اللاعب؟" المبسطة والمطورة */
function photoGame(){
  const defaultPlayers=[
    {n:'محمد صلاح',photo:'https://media.api-sports.io/football/players/306.png',h:['مصري لعب في إنجلترا وإيطاليا','أحد أساطير ليفربول']},
    {n:'كريستيانو رونالدو',photo:'https://media.api-sports.io/football/players/874.png',h:['برتغالي فاز بالأبطال مع مان يونايتد وريال مدريد','الهداف التاريخي لكرة القدم']},
    {n:'ليونيل ميسي',photo:'https://media.api-sports.io/football/players/154.png',h:['أرجنتيني فاز بكأس العالم ٢٠٢٢','أسطورة برشلونة التاريخية']},
    {n:'نيمار',photo:'https://media.api-sports.io/football/players/276.png',h:['برازيلي لعب للبارسا وباريس','أغلى صفقة انتقال في التاريخ']},
    {n:'كيليان مبابي',photo:'https://media.api-sports.io/football/players/278.png',h:['فرنسي بطل عالم ٢٠١٨','نجم ريال مدريد الحالي']},
    {n:'عمر مرموش',photo:'https://media.api-sports.io/football/players/1106.png',h:['نجم مصري متألق في أوروبا','صاحب ضربات حرة خيالية']}
  ];
  
  const pool=(LIVE_DATA.who||[]).filter(x=>x.photo).concat(defaultPlayers);
  const uniq=[...new Map(pool.map(x=>[x.n,x])).values()];
  let currentIdx = Math.floor(Math.random()*uniq.length);
  
  function renderCard(){
    const player = uniq[currentIdx];
    app.innerHTML=`
      <div class="panel fade-in">
        <div class="ttl">📸 مين اللاعب؟</div>
        <div class="photoSolo">
          <img src="${player.photo}" class="myPlayer" onerror="this.src='https://via.placeholder.com/300?text=صورة+غير+متوفرة'">
        </div>
        <div class="h" id="playerHints" hidden>
          <b>💡 تلميحات:</b><br>${player.h ? player.h.join('<br>') : 'لا توجد تلميحات إضافية'}
        </div>
        <div class="ans" id="playerName" hidden>${player.n}</div>
        <div class="row">
          <button class="btn" id="toggleHints">💡 التلميحات</button>
          <button class="btn gold" id="toggleInfo">👁️ كشف الاسم</button>
        </div>
        <div class="row">
          <button class="btn g" id="nextPhoto" style="width:100%">🔄 لاعب تاني</button>
        </div>
      </div>
    `;
    
    const nameEl = $('#playerName');
    const hintsEl = $('#playerHints');
    
    $('#toggleHints').onclick = ()=>{ playSound('click'); hintsEl.hidden = !hintsEl.hidden; };
    $('#toggleInfo').onclick = ()=>{ playSound('click'); nameEl.hidden = !nameEl.hidden; };
    
    $('#nextPhoto').onclick = ()=>{
      playSound('click');
      let next;
      do { next = Math.floor(Math.random()*uniq.length); } while(next === currentIdx && uniq.length > 1);
      currentIdx = next;
      renderCard();
    };
  }
  renderCard();
}

function settings(){
  const sound=localStorage.getItem('eg_sound')!=='off';
  app.innerHTML='<div class="panel fade-in"><div class="ttl">⚙️ الإعدادات</div><div class="h">🔊 التأثيرات الصوتية <button class="btn" id="snd" style="float:left;padding:4px 12px">'+(sound?'مفعلة':'معطلة')+'</button></div><div class="h">💰 رصيد المزاد الافتراضي <input id="bal" type="number" min="10" max="1000" value="'+(localStorage.getItem('eg_balance')||100)+'" style="width:90px;float:left"></div><div class="h" style="clear:both">🔄 مصدر البيانات: <span style="color:var(--neon)">'+(LIVE_DATA.updatedAt?'أونلاين 🌐':'مباشر ⚡')+'</span></div><button class="btn g" id="save" style="width:100%;margin-top:10px">حفظ التغييرات</button></div>';
  $('#snd').onclick=()=>{localStorage.setItem('eg_sound',sound?'off':'on');settings()};
  $('#save').onclick=()=>{playSound('click');localStorage.setItem('eg_balance',$('#bal').value);home()};
}

function xo(){
  let b=Array(9).fill(''),t='⚽',over=false;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  app.innerHTML='<div class="panel fade-in"><div class="status" id="st">الدور على: ⚽</div><div class="xo" id="g"></div><div class="row" style="margin-top:15px"><button class="btn g" id="rs" style="width:100%">ماتش جديد</button></div></div>';
  const st=$('#st'),g=$('#g');
  function draw(){g.innerHTML='';b.forEach((v,i)=>{const c=document.createElement('button');c.textContent=v;
    c.onclick=()=>{if(over||b[i])return;playSound('click');b[i]=t;
      if(L.some(l=>l.every(k=>b[k]===t))){over=true;st.textContent='🏆 الفائز: '+t;playSound('win')}
      else if(b.every(Boolean)){over=true;st.textContent='تعادل 🤝'}
      else{t=t==='⚽'?'🥅':'⚽';st.textContent='الدور على: '+t}draw()};g.appendChild(c)})}
  $('#rs').onclick=()=>{playSound('click');xo()};draw();
}

function pen(){
  const D=['شمال','وسط','يمين'],E=['⬅️','⬆️','➡️'];let n=0,s=0,res=[];
  app.innerHTML='<div class="panel fade-in"><div class="status" id="st">اختار زاوية التسديد — 5 ضربات</div><div class="photoSolo" style="font-size:50px" id="gl">🧤</div><div class="status" id="ds"></div><div class="row" id="bt"></div><div class="row"><button class="btn g" id="rs" style="display:none;width:100%">تحدي جديد</button></div></div>';
  D.forEach((d,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=E[i]+' '+d;
    b.onclick=()=>{playSound('click');const k=Math.floor(Math.random()*3),goal=k!==i;n++;if(goal)s++;res.push(goal?'⚽':'❌');
      $('#gl').textContent=goal?'⚽ جووول':'🧤 الحارس صدها!';$('#ds').textContent=res.join(' ');
      if(n===5){$('#st').textContent='النتيجة: '+s+' من 5 '+(s>=3?'🔥':'😅');if(s>=3)playSound('win');$('#bt').style.display='none';$('#rs').style.display='block'}
      else $('#st').textContent='الضربة '+(n+1)+' من 5'};$('#bt').appendChild(b)});
  $('#rs').onclick=()=>{playSound('click');pen()};
}

function timerCard(onReset){
  let left=60,run=false;
  const el=document.createElement('div');el.className='panel fade-in';
  el.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><div class="ttl" style="margin:0">⏱ المؤقت</div><div class="pill">1:00</div></div><div class="row"><button class="btn g" data-a="go">▶ بدء</button><button class="btn" data-a="ps" disabled>⏸ إيقاف</button><button class="btn" data-a="rs">↻ إعادة</button></div><div style="text-align:center"><span class="chip">جاهز</span></div>';
  const q=s=>el.querySelector(s),b=a=>q('[data-a='+a+']');
  function upd(){q('.pill').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    const c=q('.chip');c.textContent=run?'شغال...':left===0?'انتهى الوقت!':'متوقف';c.className='chip'+(run?' on':left===0?' end':'');
    b('go').disabled=run||left===0;b('ps').disabled=!run}
  b('go').onclick=()=>{playSound('click');run=true;upd();clearInterval(tm);tm=setInterval(()=>{left--;if(left<=0){left=0;run=false;clearInterval(tm);playSound('win')}else playSound('tick');upd()},1000)};
  b('ps').onclick=()=>{playSound('click');run=false;clearInterval(tm);upd()};
  b('rs').onclick=()=>{playSound('click');clearInterval(tm);run=false;left=60;upd();onReset()};
  return el;
}

function quiz(D,body,ask){
  const resets=[],seen=new Set();
  const next=()=>{let a=D.filter(x=>!seen.has(x.n));if(!a.length){seen.clear();a=D}const x=a[Math.floor(Math.random()*a.length)];seen.add(x.n);return x};
  app.innerHTML='';app.appendChild(timerCard(()=>resets.forEach(f=>f())));
  for(let n=1;n<=5;n++){
    let cur=next(),used=false;
    const c=document.createElement('div');c.className='panel fade-in';
    c.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:10px"><span class="chip">السؤال '+n+'</span></div><div class="qb"></div><div class="ans" hidden></div><div class="row"><button class="btn gold sa" style="flex:1">👁 إظهار الإجابة</button><button class="btn rf" aria-label="تغيير">🔄</button></div>';
    const qb=c.querySelector('.qb'),an=c.querySelector('.ans'),sa=c.querySelector('.sa'),rf=c.querySelector('.rf');
    const draw=()=>{qb.innerHTML=(ask?'<p style="text-align:center;font-weight:800">'+ask+'</p>':'')+body(cur);an.hidden=true;sa.textContent='👁 إظهار الإجابة'};
    sa.onclick=()=>{playSound('click');an.hidden=!an.hidden;an.textContent='الإجابة: '+cur.n;sa.textContent=an.hidden?'👁 إظهار الإجابة':'إخفاء الإجابة'};
    rf.onclick=()=>{if(used)return;playSound('click');used=true;rf.disabled=true;cur=next();draw()};
    resets.push(()=>{used=false;rf.disabled=false});
    draw();app.appendChild(c);
  }
}

function who(){
  const D=[
   {n:'ليونيل ميسي',h:['انتقلت لأوروبا وعمري ١٣ سنة لعلاج نقص هرمون النمو','سجلت ٩١ هدف في سنة ميلادية واحدة','فزت بكوبا أمريكا ٢٠٢١ وكأس العالم ٢٠٢٢']},
   {n:'كريستيانو رونالدو',h:['بدأت احترافي في سبورتينج لشبونة','فزت بالدوري في إنجلترا وإسبانيا وإيطاليا','الهداف التاريخي لبطولة دوري أبطال أوروبا']},
   {n:'محمد صلاح',h:['بدأت في المقاولون العرب بمصر','سجلت ٣٢ هدف في أول موسم لي بالدوري الإنجليزي','فزت بدوري أبطال أوروبا ٢٠١٩']}
  ];
  quiz((LIVE_DATA.who&&LIVE_DATA.who.length)?LIVE_DATA.who:D,x=>x.h.map(t=>'<div class="h">'+t+'</div>').join(''),'');
}

function trans(){
  const D=[
   {n:'ليونيل ميسي',c:['برشلونة','باريس سان جيرمان','إنتر ميامي']},
   {n:'كريستيانو رونالدو',c:['سبورتينج لشبونة','مانشستر يونايتد','ريال مدريد','يوفنتوس','النصر']},
   {n:'محمد صلاح',c:['المقاولون','بازل','تشيلسي','فيورنتينا','روما','ليفربول']}
  ];
  quiz((LIVE_DATA.trans&&LIVE_DATA.trans.length)?LIVE_DATA.trans:D,x=>'<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0">'+x.c.map(t=>'<span class="chip">'+t+'</span>').join(' ⬅️ ')+'</div>','مين اللاعب صاحب الانتقالات دي؟');
}

function auction(){
  app.innerHTML='<div class="panel fade-in"><div class="ttl">💰 المزايدة</div><p style="text-align:center">لعبة التنافسية المباشرة في القعدة!</p><button class="btn g" onclick="home()" style="width:100%">جاهزة للعب المباشر بينكم</button></div>';
}

function topTen(){
  const T=['أندية فازت بدوري الأبطال','لاعبين أصحاب الكرة الذهبية','منتخبات شاركت في كأس العالم','لاعبين لعبوا لـ ريال مدريد وبرشلونة'];
  app.innerHTML='<div class="panel fade-in"><div class="ttl">🔟 سمّي ١٠</div><div class="h" id="cat" style="text-align:center;font-size:22px;color:var(--gold)">اضغط ابدأ لعرض الفئة</div><button class="btn g" id="go" style="width:100%;margin-top:10px">ابدأ الفئة</button></div>';
  $('#go').onclick=()=>{playSound('click');$('#cat').textContent=T[Math.floor(Math.random()*T.length)];};
